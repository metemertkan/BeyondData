# Episode 1: Acme Cloud's billing database.
#   docker compose up -d                      # Postgres on localhost:5436
#   uv run python -m ledger.world --load      # create the tables, roles and data
services:
  ledger-db:
    image: postgres:16-alpine
    container_name: beyonddata-ledger-db
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: ledger
    ports:
      - "${LEDGER_DB_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
