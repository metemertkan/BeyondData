# Episode 6: when the data changes after it's been indexed. Its own project: `down -v` here never touches Episodes 1-5.
#   docker compose -f docker-compose.ep06.yml up -d record weaviate ollama        # the help center, its index, the model
#   docker compose -f docker-compose.ep06.yml --profile stores up -d <service>    # Act 2's six databases, one at a time
name: beyonddata-ep06

x-limits: &limits
  cpuset: "0-5,12-17"     # as Episodes 2-4: 12 threads and 16 GB per database; the client runs on the other cores
  mem_limit: 16g
  memswap_limit: 16g
  restart: "no"

services:
  # The record: Acme Cloud's help center. Logical decoding on, for the CDC designs.
  record:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: bd6-record
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=8", "-c", "max_wal_senders=8"]
    environment: {POSTGRES_USER: acme, POSTGRES_PASSWORD: acme, POSTGRES_DB: helpcenter}
    ports: ["127.0.0.1:5446:5432"]
    volumes: [record:/var/lib/postgresql]

  # The index for the split designs: one collection per design.
  weaviate:
    image: semitechnologies/weaviate:1.40.7
    container_name: bd6-weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports: ["127.0.0.1:8086:8080", "127.0.0.1:50056:50051"]
    volumes: [weaviate:/var/lib/weaviate]

  # The model that answers: qwen3:8b on the CPU, as in Episode 5.
  ollama:
    image: ollama/ollama:0.40.11
    container_name: bd6-ollama
    cpuset: "0-23"
    environment: {OLLAMA_NUM_PARALLEL: "1"}
    ports: ["127.0.0.1:11436:11434"]
    volumes: [models:/root/.ollama]

volumes: {record: {}, weaviate: {}, models: {}}
