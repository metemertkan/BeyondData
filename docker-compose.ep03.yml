# Episode 3: the same six databases, images and limits as Episode 2, for filtered search. One at a time:
#   docker compose -f docker-compose.ep03.yml up -d <service>
# Each gets cores 0-5 and their hyperthreads (12 threads) and 16 GB; the client runs on the other cores.
name: beyonddata-ep03  # its own project: `down -v` here never touches Episode 1 or 2

x-limits: &limits
  cpuset: "0-5,12-17"
  mem_limit: 16g
  memswap_limit: 16g
  restart: "no"

services:
  pgvector:
    <<: *limits
    image: pgvector/pgvector:0.8.7-pg18
    container_name: bd3-pgvector
    environment: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    shm_size: 4g   # Docker's 64 MB /dev/shm would cap parallel workers, not Postgres's own defaults
    ports: ["5437:5432"]
    volumes: [pgvector:/var/lib/postgresql]

  qdrant:
    <<: *limits
    image: qdrant/qdrant:v1.20.2
    container_name: bd3-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant:/qdrant/storage]

  milvus:
    <<: *limits
    image: milvusdb/milvus:v3.0.6
    container_name: bd3-milvus
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    ports: ["19530:19530", "9091:9091"]
    volumes:
      - milvus:/var/lib/milvus
      - ./vectors/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./vectors/milvus/user.yaml:/milvus/configs/user.yaml:ro

  weaviate:
    <<: *limits
    image: semitechnologies/weaviate:1.40.7
    container_name: bd3-weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    ports: ["8081:8080", "50051:50051"]
    volumes: [weaviate:/var/lib/weaviate]

  elasticsearch:
    <<: *limits
    image: elasticsearch:9.5.5
    container_name: bd3-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ulimits: {memlock: {soft: -1, hard: -1}}
    ports: ["9201:9200"]
    volumes: [elasticsearch:/usr/share/elasticsearch/data]

  chroma:
    <<: *limits
    image: chromadb/chroma:1.5.9
    container_name: bd3-chroma
    ports: ["8001:8000"]
    volumes: [chroma:/data]

volumes: {pgvector: {}, qdrant: {}, milvus: {}, weaviate: {}, elasticsearch: {}, chroma: {}}
