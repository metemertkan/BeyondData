[project]
name = "beyonddata"
version = "0.1.0"
description = "Beyond the PoC: what happens to your data once an AI system uses it, measured."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "numpy>=2.0",
    "pyarrow>=26.0.1",
    "pgvector>=0.5.1",
    "qdrant-client>=1.20.0",
    "pymilvus>=3.0.3",
    "weaviate-client>=4.24.1",
    "elasticsearch>=9.5.1",
    "chromadb-client>=1.5.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
